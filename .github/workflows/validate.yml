name: HUI validation
on:
  push:
    branches: [HUI]
  pull_request:
    branches: [HUI]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip
      - name: Check Lua syntax
        run: |
          find src -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
      - name: Check live API version metadata
        run: grep -q '^## APIVersion: 101051$' ESOHybridUI.txt
      - name: Check manifest paths
        run: |
          awk '!/^#/ && NF {print}' ESOHybridUI.txt | while read file; do
            test -f "$file" || { echo "Missing manifest file: $file"; exit 1; }
          done
      - name: Build addon ZIP with the correct root folder
        run: |
          mkdir -p package/ESOHybridUI
          cp ESOHybridUI.txt package/ESOHybridUI/
          cp -R src package/ESOHybridUI/
          cd package
          zip -r ../HUI.zip ESOHybridUI
      - uses: actions/upload-artifact@v4
        with:
          name: HUI-addon
          path: HUI.zip
